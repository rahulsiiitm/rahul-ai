[project]
name = "zero-backend"
version = "0.1.0"
description = "Backend for Rahul AI"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E701", "E402"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict = true
exclude = ["tests/", "scratch/"]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: requires live credentials or a running backend",
]
